<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A85C"/>
      <stop offset="50%" style="stop-color:#E0C47A"/>
      <stop offset="100%" style="stop-color:#C9A85C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0B0B0B"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.4"/>
  
  <!-- NEW text - curved top -->
  <path id="topArc" d="M 35 100 A 65 65 0 0 1 165 100" fill="none"/>
  <text font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="url(#goldGrad)" letter-spacing="8">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">NEW</textPath>
  </text>
  
  <!-- NS in center -->
  <text x="100" y="108" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#goldGrad)" letter-spacing="-2">NS</text>
  
  <!-- SEASON text - curved bottom -->
  <path id="bottomArc" d="M 30 110 A 70 70 0 0 0 170 110" fill="none"/>
  <text font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="url(#goldGrad)" letter-spacing="6">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">SEASON</textPath>
  </text>
</svg>